version: '3.9'

services:

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    ports:
      - "9000:9000" # MinIO S3 API port
      - "9001:9001" # MinIO Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network

  mysql:
    image: mysql:9.5.0
    restart: no
    ports:
      - 3306:3306
    expose:
      - 3306
    environment:
      MYSQL_ROOT_PASSWORD: r00t
      MYSQL_PASSWORD: r00t
      MYSQL_DATABASE: pawn
    networks:
      - backend

  pawn-service-be:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - minio
    restart: always
    ports:
      - "8080:8080"
    environment:
#      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/pawn?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=r00t
      - AWS_S3_ENDPOINT=https://chamber-corners-alloy-gpl.trycloudflare.com
    networks:
      - app-network
      - backend

  nginx-proxy:
    image: 'nginx:latest'
    restart: unless-stopped
    ports:
      - '80:80'   # Port cho traffic web
      - '443:443' # Port cho HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token xxxx
    networks:
      - app-network
      - backend

volumes:
  minio_data:
    driver: local

networks:
  app-network:
    external: true
  backend:
    name: server-network
    driver: bridge