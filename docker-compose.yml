version: '3.9'

services:

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    ports:
      - "9000:9000" # MinIO S3 API port
      - "9001:9001" # MinIO Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  mysql:
    image: mysql:9.5.0
    restart: no
    ports:
      - 3306:3306
    expose:
      - 3306
    environment:
      MYSQL_ROOT_PASSWORD: r00t
      MYSQL_PASSWORD: r00t
      MYSQL_DATABASE: pawn

  pawn-service-be:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - minio
    restart: always
    ports:
      - "8080:8080"
    environment:
#      - SPRING_PROFILES_ACTIVE=mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/pawn?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=r00t
      - AWS_S3_ENDPOINT=http://minio:9000

  nginx-proxy:
    image: 'nginx:latest'
    restart: unless-stopped
    ports:
      - '80:80'   # Port cho traffic web
      - '443:443' # Port cho HTTPS
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./deploy/nginx/proxy-params.conf:/etc/nginx/snippets/proxy-params.conf

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    privileged: true
    user: root
    ports:
      - 8000:8000
      - 50000:50000
    volumes:
      - /var/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Để Jenkins gọi Docker máy host
    restart: unless-stopped

volumes:
  minio_data:
    driver: local