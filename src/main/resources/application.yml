spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: backend
  datasource:
#    mysql -u root -p pawn
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/pawn?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:r00t}
  jpa:
    auditor-aware-ref: JpaAuditingConfig
    show-sql: false
    hibernate:
      ddl-auto: update # or create, validate, none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  security:
    secret-key: ${JWT_SECRET_KEY:}
  ai:
    openai:
      api-key: ${AI_OPENAI_API_KEY:sk-proj-xxxxx}
      chat:
        options:
          model: gpt-4o-mini

jobrunr:
  background-job-server:
    enabled: true
  job-scheduler:
    enabled: true
  dashboard:
    enabled: true
    username: ${JOBRUNR_USERNAME:admin}
    password: ${JOBRUNR_PASSWORD:admin}

aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY:minioadmin}
    secret-key: ${AWS_S3_SECRET_KEY:minioadmin}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
    bucket: pawn-service

stripe:
  secret-key: ${STRIPE_API_KEY:sk_test_xxxxpI0XB5C}
  success-url: ${STRIPE_SUCCESS_URL:https://mail.google.com}
  cancel-url: ${STRIPE_CANCEL_URL:https://dashboard.stripe.com}

server:
  port: ${BE_PORT:8080}