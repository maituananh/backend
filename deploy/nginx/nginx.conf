server {
  set $forward_scheme http;
  set $server "172.17.0.1";
  set $port 80;

  listen 80;
  listen [::]:80;

  server_name api.baotrang.io.vn;
  http2 off;

  access_log /dev/stdout combined;
  error_log  /dev/stderr warn;

  include snippets/proxy-params.conf;

  location / {
    proxy_pass http://172.17.0.1:8080;
  }
}

